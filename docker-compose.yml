services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./new-backend/api
      dockerfile: Dockerfile
    image: borkanie/continousdemocracyapi:latest
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: parliamentdb
      PORT: "8080"
      LOG_LEVEL: info
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEnd/web
      dockerfile: Dockerfile
    image: borkanie/parliament-web:latest
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # Scraper runs every 12 hours. Start manually with:
  #   docker compose --profile scraper up scraper
  scraper:
    build:
      context: ./new-backend/scraper
      dockerfile: Dockerfile
    image: borkanie/populate-laws:latest
    profiles:
      - scraper
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: parliamentdb
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CDEP_PROXY_URL: ${CDEP_PROXY_URL:-}
    restart: unless-stopped

volumes:
  mongo_data:
