apiVersion: apps/v1
kind: Deployment
metadata:
  name: parliament-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parliament-api
  template:
    metadata:
      labels:
        app: parliament-api
    spec:
      containers:
        - name: api
          image: borkanie/continousdemocracyapi:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: parliament-config
                  key: db-name
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: parliament-api
spec:
  selector:
    app: parliament-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
