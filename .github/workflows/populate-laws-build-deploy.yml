name: Build & Publish parliament-scraper Image

on:
  push:
    branches: ["main"]
    paths:
      - new-backend/scraper/**
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    environment: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push scraper image
        uses: docker/build-push-action@v4
        with:
          context: new-backend/scraper
          push: true
          tags: |
            borkanie/populate-laws:latest
            borkanie/populate-laws:${{ github.sha }}

  deploy-local:
    name: Pull and restart scraper on self-hosted runner
    needs: build-and-push
    runs-on: self-hosted
    environment: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull image and restart container
        env:
          IMAGE_NAME: borkanie/populate-laws:latest
        run: |
          set -e
          docker pull $IMAGE_NAME

          docker stop parliament-scraper 2>/dev/null || true
          docker rm   parliament-scraper 2>/dev/null || true

          docker run -d \
            --name parliament-scraper \
            -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            -e DB_NAME="${{ secrets.MONGODB_DB_NAME }}" \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e CDEP_PROXY_URL="${{ secrets.CDEP_PROXY_URL }}" \
            -e LOG_LEVEL="${{ inputs.logLevel || 'warning' }}" \
            --restart unless-stopped \
            $IMAGE_NAME

          docker ps --filter name=parliament-scraper
          echo "Scraper deployment complete!"
