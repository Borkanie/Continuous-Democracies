name: CI/CD deploy Backend Docker Image

on:
  push:
    branches: ["main"]
    paths:
      - new-backend/api/**
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE=borkanie/continousdemocracyapi:latest
          docker build -t $IMAGE ./new-backend/api
          docker push $IMAGE

      - name: Deploy container
        run: |
          IMAGE_NAME="borkanie/continousdemocracyapi:latest"
          CONTAINER_NAME="continuous-democracies"

          echo "Pulling latest image..."
          docker pull $IMAGE_NAME

          if [ "$(docker ps -aq -f name=$CONTAINER_NAME)" ]; then
            echo "Stopping and removing existing container..."
            docker stop $CONTAINER_NAME
            docker rm $CONTAINER_NAME
          fi

          echo "Starting new container..."
          docker run -d \
            --name $CONTAINER_NAME \
            -p 8080:8080 \
            -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            -e DB_NAME="${{ secrets.MONGODB_DB_NAME }}" \
            -e PORT="8080" \
            -e LOG_LEVEL="${{ inputs.logLevel || 'warning' }}" \
            --restart unless-stopped \
            $IMAGE_NAME

          echo "Backend deployment complete!"
